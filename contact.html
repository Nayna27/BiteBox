<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BiteBox</title>
</head>
<body>
    <img src="assets/images/logo.png" alt="BiteBox Logo" width="150">
    <h1>Contact</h1>
    <!-- Navigation -->
    <p>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </p>
    
    <h2> Visit Our Website </h2>

    <p>
        <a href="https://www.google.com/">Visit Google</a>    
    </p>
    <hr>

    <h2>Customer Registration & Order Form</h2>

    <form action="" method="post">
        <h3>Customer Information</h3>

        <label for="fullname">Full Name</label>
        <br>
        <input type="text" class="fullname" id="fullname">
        <br><br>

        <label for="email">Email Address</label>
        <br>
        <input type="email" id="email" class="email">
        <br><br>

        <label for="password">Password</label>
        <br>
        <input type="password" id="password" class="password">
        <br><br>

        <label for="phone">Phone Number</label>
        <br>
        <input type="tel" id="phone" class="phone">
        <br><br>

        <h3>Order Information</h3>
        <label for="quality">Quantity</label>
        <br>
        <input type="number" class="quality" id="quality">
        <br><br>

        <label for="deliveryDate">Preferred Delivery Date</label>
        <br>
        <input type="date" id="deliveryDate" class="deliveryDate">
        <br><br>

        <label for="food">Select Food Item</label>
        <select name="food" id="food">
            <option value="">Veg Pizza</option>
            <option value="">Cheese Burger</option>
            <option value="">White Sauce Pasta</option>
            <option value="">Veg Grilled Sandwich</option>
            <option value="">Chocolate Brownie</option>
        </select>

        <h3>Payment Method</h3>
        <input type="radio" id="cash" name="payment" >
        <label for="cash">Cash</label>
        <br>

        <input type="radio" id="card" name="payment">
        <label for="card">Card</label>
        <br>

        <input type="radio" id="upi" name="payment">
        <label for="upi">UPI</label>

        <h3>Extras</h3>
        <input type="checkbox" id="cheese" name="extras">
        <label for="cheese">Extra Cheese</label>
        <br>

        <input type="checkbox" id="drink" name="extras">
        <label for="drink">Cold Drink</label>
        <br>

        <input type="checkbox" id="dessert" name="extras">
        <label for="dessert">Dessert</label>
        <br><br>

        <h3>Delivery Instructions</h3>
        <label for="address">Delivery Address</label>
        <br>
        <textarea name="address" id="address" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear Form">
    </form>

</body>
</html>
